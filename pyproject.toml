[project]
name = "elfparser"
version = "0.1.0"
description = "ELF BSS section inspector with DWARF parsing"
authors = [
    { name = "Uneld" }
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pyelftools",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
